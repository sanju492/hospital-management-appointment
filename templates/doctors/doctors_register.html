<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Doctor Registration | Evora Hospital</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef7ff,
                    #f8fbff
                );

            min-height: 100vh;

            padding: 35px;
        }


        .container {

            max-width: 900px;

            margin: auto;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 45px
                rgba(18, 59, 99, 0.12);
        }


        .header {

            text-align: center;

            margin-bottom: 30px;
        }


        .logo {

            color: #1976d2;

            font-size: 27px;

            font-weight: bold;
        }


        .header h1 {

            color: #123b63;

            margin-top: 15px;

            font-size: 28px;
        }


        .header p {

            color: #718096;

            margin-top: 8px;
        }


        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }


        .form-group {

            display: flex;

            flex-direction: column;
        }


        .full {

            grid-column: 1 / -1;
        }


        label {

            color: #123b63;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        input,
        select,
        textarea {

            padding: 13px;

            border: 1px solid #ccd8e5;

            border-radius: 9px;

            font-size: 14px;

            outline: none;
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #1976d2;

            box-shadow:
                0 0 0 3px
                rgba(25,118,210,0.08);
        }


        textarea {

            min-height: 100px;

            resize: vertical;
        }


        .submit {

            width: 100%;

            border: none;

            background: #1976d2;

            color: white;

            padding: 14px;

            border-radius: 9px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 25px;
        }


        .submit:hover {

            background: #123b63;
        }


        .login {

            text-align: center;

            margin-top: 20px;

            color: #718096;
        }


        .login a {

            color: #1976d2;

            font-weight: bold;

            text-decoration: none;
        }


        .message {

            background: #fff4e5;

            color: #a05a00;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;
        }


        @media (max-width: 650px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <div class="logo">
            + EVORA HOSPITAL
        </div>

        <h1>
            Create Doctor Account
        </h1>

        <p>
            Register as a healthcare professional
        </p>

    </div>


    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form
        method="POST"
    >

        {% csrf_token %}


        <div class="form-grid">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="full_name"
                    placeholder="Dr. John Smith"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="doctor123"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="doctor@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    placeholder="Enter phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Specialization
                </label>

                <select
                    name="specialization"
                    required
                >

                    <option value="">
                        Select Specialization
                    </option>

                    <option value="cardiology">
                        Cardiology
                    </option>

                    <option value="dermatology">
                        Dermatology
                    </option>

                    <option value="neurology">
                        Neurology
                    </option>

                    <option value="orthopedics">
                        Orthopedics
                    </option>

                    <option value="pediatrics">
                        Pediatrics
                    </option>

                    <option value="general">
                        General Medicine
                    </option>

                    <option value="gynecology">
                        Gynecology
                    </option>

                    <option value="ent">
                        ENT
                    </option>

                    <option value="dentistry">
                        Dentistry
                    </option>

                    <option value="psychiatry">
                        Psychiatry
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Qualification
                </label>

                <input
                    type="text"
                    name="qualification"
                    placeholder="MBBS, MD"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Experience (Years)
                </label>

                <input
                    type="number"
                    name="experience"
                    min="0"
                    placeholder="5"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Consultation Fee
                </label>

                <input
                    type="number"
                    name="consultation_fee"
                    min="0"
                    step="0.01"
                    placeholder="500"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Available Days
                </label>

                <input
                    type="text"
                    name="available_days"
                    placeholder="Mon, Tue, Wed"
                >

            </div>


            <div class="form-group">

                <label>
                    Available Time
                </label>

                <input
                    type="text"
                    name="available_time"
                    placeholder="10:00 AM - 4:00 PM"
                >

            </div>


            <div class="form-group full">

                <label>
                    Professional Bio
                </label>

                <textarea
                    name="bio"
                    placeholder="Tell patients about your experience and expertise..."
                ></textarea>

            </div>


        </div>


        <button
            type="submit"
            class="submit"
        >
            Create Doctor Account
        </button>


    </form>


    <div class="login">

        Already have an account?

        <a href="{% url 'doctor_login' %}">
            Login
        </a>

    </div>


</div>


</body>

</html>
