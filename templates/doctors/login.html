{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Doctor Login | Evora Hospital</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #f5f8fc,
                    #eaf4ff
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }

        .login-container {

            width: 100%;

            max-width: 430px;

            background: #ffffff;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(18, 59, 99, 0.12);

        }

        .logo {

            text-align: center;

            color: #123b63;

            font-size: 24px;

            font-weight: 800;

            letter-spacing: 1px;

            margin-bottom: 25px;

        }

        .logo-icon {

            width: 55px;

            height: 55px;

            margin: 0 auto 12px;

            background: #16a085;

            color: white;

            border-radius: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

            font-weight: bold;

        }

        h1 {

            text-align: center;

            color: #172b4d;

            font-size: 28px;

            margin-bottom: 8px;

        }

        .subtitle {

            text-align: center;

            color: #718096;

            font-size: 13px;

            margin-bottom: 30px;

        }

        .messages {

            margin-bottom: 20px;

        }

        .message {

            background: #fff3cd;

            color: #856404;

            padding: 12px;

            border-radius: 8px;

            font-size: 13px;

            margin-bottom: 8px;

        }

        .form-group {

            margin-bottom: 20px;

        }

        label {

            display: block;

            color: #34495e;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 8px;

        }

        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d9e2ec;

            border-radius: 9px;

            font-size: 14px;

            outline: none;

            transition: 0.2s;

        }

        input:focus {

            border-color: #16a085;

            box-shadow:
                0 0 0 3px
                rgba(22, 160, 133, 0.10);

        }

        .login-btn {

            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 10px;

            background: #16a085;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;

        }

        .login-btn:hover {

            background: #0e806a;

            transform: translateY(-1px);

        }

        .links {

            text-align: center;

            margin-top: 25px;

        }

        .links p {

            color: #718096;

            font-size: 13px;

            margin-bottom: 10px;

        }

        .links a {

            color: #1976d2;

            text-decoration: none;

            font-weight: 700;

        }

        .links a:hover {

            text-decoration: underline;

        }

        .home-link {

            display: inline-block;

            margin-top: 8px;

            color: #425466 !important;

            font-size: 12px;

            font-weight: normal !important;

        }

        @media (max-width: 480px) {

            .login-container {

                padding: 30px 22px;

            }

            h1 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="logo">

        <div class="logo-icon">

            +

        </div>

        EVORA HOSPITAL

    </div>


    <h1>

        Doctor Login

    </h1>


    <p class="subtitle">

        Login to manage your appointments and profile

    </p>


    {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div class="message">

                    {{ message }}

                </div>

            {% endfor %}

        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label for="username">

                Username

            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">

                Password

            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-btn">

            Login as Doctor

        </button>

    </form>


    <div class="links">

        <p>

            Not registered yet?

            <a href="{% url 'register_choice' %}">

                Create Account

            </a>

        </p>


        <a
            href="{% url 'patient_login' %}">

            Login as Patient

        </a>


        <br>


        <a
            href="{% url 'home' %}"
            class="home-link">

            ← Back to Home

        </a>

    </div>


</div>


</body>

</html>
