<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>{{ service_name }} // EVORA SECURITY TERMINAL</title>
    <style>
        /* ---------- RESET / GLOBAL ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050a0c;
            background-image:
                linear-gradient(rgba(0, 255, 180, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 180, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, 'Lucida Sans Typewriter', monospace;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* scanline overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 180, 0.02) 0px,
                rgba(0, 255, 180, 0.02) 2px,
                transparent 2px,
                transparent 6px
            );
            pointer-events: none;
            z-index: 10;
        }

        /* subtle vignette + green haze */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 50%, rgba(0, 20, 20, 0.7) 100%);
            pointer-events: none;
            z-index: 9;
        }

        /* ---------- TERMINAL CARD ---------- */
        .password-card {
            width: 520px;
            max-width: 100%;
            background: rgba(4, 12, 14, 0.92);
            border: 1px solid #1affb0;
            border-radius: 0;
            padding: 36px 34px 30px;
            position: relative;
            z-index: 20;
            box-shadow:
                0 0 12px rgba(26, 255, 176, 0.25),
                0 0 40px rgba(26, 255, 176, 0.08),
                inset 0 0 20px rgba(0, 255, 180, 0.03);
            backdrop-filter: blur(1px);
            transition: box-shadow 0.2s;
        }

        /* corner accents */
        .password-card::before,
        .password-card::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #00ffc3;
            pointer-events: none;
            opacity: 0.7;
        }

        .password-card::before {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }

        .password-card::after {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }

        /* ---------- TERMINAL HEADER ---------- */
        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 255, 180, 0.2);
        }

        .terminal-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #1affb0;
            box-shadow: 0 0 6px #1affb0;
            opacity: 0.6;
        }

        .terminal-dot:nth-child(2) {
            background: #0ff;
            box-shadow: 0 0 6px #0ff;
            opacity: 0.5;
        }

        .terminal-dot:nth-child(3) {
            background: #1affb0;
            box-shadow: 0 0 6px #1affb0;
            opacity: 0.3;
        }

        .terminal-title {
            margin-left: auto;
            color: #1affb0;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.6;
        }

        /* ---------- TYPING AREA ---------- */
        .typing-area {
            margin-bottom: 22px;
            min-height: 48px;
        }

        .typing-line {
            color: #1affb0;
            font-size: 15px;
            letter-spacing: 0.5px;
            line-height: 1.6;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .typing-line .prompt {
            color: #0ff;
            margin-right: 8px;
            font-weight: bold;
            text-shadow: 0 0 4px #0ff;
        }

        .typing-line .text {
            color: #b0ffe8;
            text-shadow: 0 0 4px rgba(26, 255, 176, 0.4);
        }

        .blinking-cursor {
            display: inline-block;
            width: 9px;
            height: 17px;
            background: #1affb0;
            margin-left: 4px;
            box-shadow: 0 0 8px #1affb0;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ---------- LOCK / SHIELD ICON ---------- */
        .lock-icon {
            display: flex;
            justify-content: center;
            margin-bottom: 14px;
            filter: drop-shadow(0 0 10px rgba(26, 255, 176, 0.6));
        }

        .shield-svg {
            width: 56px;
            height: 56px;
            stroke: #1affb0;
            fill: none;
            stroke-width: 1.5;
            transition: filter 0.2s;
        }

        .shield-svg .terminal-prompt {
            stroke: #0ff;
            stroke-width: 1.6;
        }

        /* ---------- HEADINGS ---------- */
        .logo {
            font-size: 13px;
            letter-spacing: 5px;
            color: #1affb0;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 6px;
            opacity: 0.7;
            font-weight: 400;
        }

        h1 {
            color: #ccfff0;
            font-size: 22px;
            font-weight: 400;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(26, 255, 176, 0.3);
            word-break: break-word;
        }

        .subtitle {
            color: #4a7a6e;
            font-size: 12px;
            text-align: center;
            margin-bottom: 26px;
            letter-spacing: 0.5px;
            line-height: 1.6;
        }

        .subtitle .cmd {
            color: #0ff;
            opacity: 0.7;
        }

        /* ---------- ERROR / SECURITY ALERT ---------- */
        .error-message {
            background: rgba(255, 30, 30, 0.08);
            border: 1px solid #ff4d4d;
            border-left: 3px solid #ff4d4d;
            color: #ff8a8a;
            padding: 10px 14px;
            margin-bottom: 18px;
            font-size: 13px;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 12px rgba(255, 50, 50, 0.15);
            animation: alertPulse 1.8s infinite;
        }

        .error-message::before {
            content: "⚠";
            font-size: 15px;
            color: #ff4d4d;
            text-shadow: 0 0 6px #ff4d4d;
        }

        @keyframes alertPulse {
            0%, 100% { border-color: #ff4d4d; box-shadow: 0 0 8px rgba(255, 50, 50, 0.15); }
            50% { border-color: #ff8080; box-shadow: 0 0 18px rgba(255, 50, 50, 0.3); }
        }

        /* ---------- INPUT ---------- */
        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group::before {
            content: ">_";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #1affb0;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 6px #1affb0;
            pointer-events: none;
            opacity: 0.8;
        }

        .password-input {
            width: 100%;
            padding: 14px 14px 14px 42px;
            background: rgba(0, 20, 16, 0.7);
            border: 1px solid #1a4a3a;
            border-radius: 0;
            color: #b0ffe8;
            font-size: 15px;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 1px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            caret-color: #1affb0;
        }

        .password-input::placeholder {
            color: #2d5a4a;
            letter-spacing: 0.5px;
            font-size: 13px;
        }

        .password-input:focus {
            border-color: #1affb0;
            box-shadow: 0 0 14px rgba(26, 255, 176, 0.25), inset 0 0 10px rgba(26, 255, 176, 0.05);
        }

        /* ---------- BUTTON ---------- */
        .access-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid #1affb0;
            border-radius: 0;
            color: #1affb0;
            font-size: 15px;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background 0.2s, box-shadow 0.2s, color 0.2s;
            box-shadow: 0 0 10px rgba(26, 255, 176, 0.15);
            font-weight: 400;
        }

        .access-btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(26, 255, 176, 0.15), transparent);
            transition: left 0.4s;
        }

        .access-btn:hover {
            background: rgba(26, 255, 176, 0.08);
            box-shadow: 0 0 22px rgba(26, 255, 176, 0.35), inset 0 0 16px rgba(26, 255, 176, 0.08);
            color: #ccfff0;
        }

        .access-btn:hover::after {
            left: 100%;
        }

        .access-btn:active {
            transform: scale(0.985);
        }

        /* ---------- BACK LINK ---------- */
        .back-btn {
            display: inline-block;
            margin-top: 22px;
            text-decoration: none;
            color: #2d7a62;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.2s, text-shadow 0.2s;
            border-bottom: 1px dashed rgba(26, 255, 176, 0.2);
            padding-bottom: 2px;
            font-family: 'Courier New', Courier, monospace;
        }

        .back-btn:hover {
            color: #1affb0;
            text-shadow: 0 0 8px rgba(26, 255, 176, 0.5);
            border-bottom-color: #1affb0;
        }

        /* ---------- STATUS BAR (bottom) ---------- */
        .status-bar {
            margin-top: 24px;
            padding-top: 12px;
            border-top: 1px solid rgba(26, 255, 176, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: #1a4a3a;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .status-bar .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-bar .status-dot {
            width: 6px;
            height: 6px;
            background: #1affb0;
            border-radius: 50%;
            box-shadow: 0 0 6px #1affb0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 560px) {
            .password-card {
                padding: 26px 18px 22px;
            }

            h1 {
                font-size: 18px;
            }

            .typing-line {
                font-size: 13px;
            }

            .password-input {
                font-size: 14px;
                padding: 12px 12px 12px 38px;
            }

            .access-btn {
                font-size: 13px;
                letter-spacing: 2px;
                padding: 12px;
            }

            .terminal-title {
                font-size: 9px;
                letter-spacing: 1px;
            }

            .status-bar {
                font-size: 8px;
                letter-spacing: 0.8px;
            }

            .shield-svg {
                width: 44px;
                height: 44px;
            }
        }

        @media (max-width: 380px) {
            .password-card {
                padding: 20px 12px 18px;
            }

            h1 {
                font-size: 15px;
            }

            .logo {
                font-size: 11px;
                letter-spacing: 3px;
            }

            .subtitle {
                font-size: 11px;
            }
        }

        /* reduced motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="password-card">

        <!-- terminal window bar -->
        <div class="terminal-bar">
            <span class="terminal-dot"></span>
            <span class="terminal-dot"></span>
            <span class="terminal-dot"></span>
            <span class="terminal-title">SECURE SHELL // v2.7</span>
        </div>

        <!-- logo -->
        <div class="logo">+ EVORA HOSPITAL</div>

        <!-- shield / terminal icon -->
        <div class="lock-icon">
            <svg class="shield-svg" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                <!-- shield outline -->
                <path d="M30 4 L52 14 L52 28 C52 42 40 52 30 56 C20 52 8 42 8 28 L8 14 Z"
                      stroke="#1affb0" fill="none" stroke-width="1.8" stroke-linejoin="round"/>
                <!-- terminal prompt inside shield -->
                <path d="M21 22 L27 28 L21 34" stroke="#0ff" fill="none" stroke-width="1.8"
                      stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="30" y1="34" x2="39" y2="34" stroke="#0ff" stroke-width="1.8" stroke-linecap="round"/>
                <!-- small lock keyhole at top -->
                <circle cx="30" cy="14" r="2.2" fill="#1affb0" opacity="0.5"/>
            </svg>
        </div>

        <!-- service name -->
        <h1>{{ service_name }}</h1>

        <!-- typing / subtitle area -->
        <div class="typing-area">
            <div class="typing-line">
                <span class="prompt">&gt;</span>
                <span class="text">AUTHENTICATION REQUIRED</span>
                <span class="blinking-cursor"></span>
            </div>
            <div class="typing-line" style="margin-top: 2px;">
                <span class="prompt">&gt;</span>
                <span class="text">ENTER ACCESS PASSWORD</span>
            </div>
        </div>

        <!-- error messages from Django -->
        {% if messages %}
            {% for message in messages %}
                <div class="error-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- password form — unchanged backend -->
        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <input
                    type="password"
                    name="password"
                    class="password-input"
                    placeholder="••••••••••••"
                    required
                    autocomplete="off"
                    autofocus
                >
            </div>

            <button type="submit" class="access-btn">
                Access Service
            </button>
        </form>

        <!-- back to home -->
        <a href="{% url 'home' %}" class="back-btn">
            &lt;-- Back to Home
        </a>

        <!-- bottom status bar -->
        <div class="status-bar">
            <span class="status-item">
                <span class="status-dot"></span> SECURE CHANNEL
            </span>
            <span>EVORA SECURITY TERMINAL</span>
        </div>

    </div>

    <!-- minimal vanilla JS: keep cursor positioned naturally; no frameworks -->
    <script>
        (function() {
            // subtle flicker / life — only if reduced motion is not preferred
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            const card = document.querySelector('.password-card');
            if (!card) return;

            // very subtle border glow fluctuation (barely noticeable, professional)
            let glowIntensity = 0.2;
            let direction = 1;

            setInterval(function() {
                glowIntensity += 0.02 * direction;
                if (glowIntensity >= 0.35) direction = -1;
                if (glowIntensity <= 0.15) direction = 1;
                card.style.boxShadow =
                    '0 0 12px rgba(26, 255, 176, ' + glowIntensity + '), ' +
                    '0 0 40px rgba(26, 255, 176, 0.08), ' +
                    'inset 0 0 20px rgba(0, 255, 180, 0.03)';
            }, 180);
        })();
    </script>

</body>
</html>
